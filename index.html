<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Shredder</title>
    <style>
        :root {
            /* ORIGINAL THEME COLORS */
            --fretboard-color: #2c241b;  /* Dark Wood */
            --fret-wire-color: #c0c0c0;  /* Silver */
            --note-bg: #eee;             /* White/Grey */
            --note-text: #333;           /* Dark Grey Text */
            --root-note-bg: #f2a33a;     /* Amber accent */
            --root-note-text: #1e1608;
            --scale-note-bg: #d8d2c4;    /* Soft off-white */
            --scale-note-text: #2a2520;
            --playing-note-bg: #ffffff;  /* Bright white while playing */
            --playing-note-text: #1e1608;
            --inlay-color: rgba(255, 255, 255, 0.2);
            --box-border-color: #f2a33a;
            --box-bg-tint: rgba(242, 163, 58, 0.12);
            --accent: #f2a33a;
            --accent-hover: #f6b65c;
            --accent-text: #1e1608;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 5%;
            user-select: none;
            overflow-x: hidden;
            touch-action: manipulation;   /* no double-tap zoom when tapping quickly */
            -webkit-tap-highlight-color: transparent;
        }

        h1 { margin: 5px 0 20px; font-size: 1.5rem; }
        

        .controls {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
        }

        .control-group { display: flex; flex-direction: column; min-width: 60px; }
        label { font-size: 0.7rem; margin-bottom: 4px; color: #aaa; font-weight: bold; }
        
        select, input[type="number"] { 
            padding: 4px 8px; font-size: 0.9rem; border-radius: 4px; border: none; 
            cursor: pointer; height: 30px; width: 100%; background: white; color: black;
        }
        input[type="number"] { width: 50px; }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: #555;
            border-radius: 3px;
            outline: none;
            margin-bottom: 10px;
        }
        .tempo-row { display: flex; align-items: center; gap: 8px; }
        .tempo-row input[type="range"] { margin-bottom: 0; }
        .tempo-row input[type="number"] { width: 60px; cursor: text; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        button.action-btn {
            background-color: var(--accent); color: var(--accent-text); border: none; padding: 0 15px;
            font-size: 0.9rem; font-weight: bold; border-radius: 4px; cursor: pointer;
            height: 30px; transition: background 0.2s; min-width: 90px;
        }
        button.action-btn:hover { background-color: var(--accent-hover); }
        button.action-btn.stop { background-color: #c8553d; color: #fff; }
        button.action-btn.stop:hover { background-color: #d9674f; }
        button.action-btn.toggle { background-color: transparent; color: #ccc; border: 1px solid #555; min-width: 80px; }
        button.action-btn.toggle:hover { background-color: rgba(255,255,255,0.06); }
        button.action-btn.toggle.active { background-color: transparent; color: var(--accent); border-color: var(--accent); }
        button.action-btn.toggle.active:hover { background-color: rgba(242, 163, 58, 0.1); }

        .fretboard-container {
            width: 100%;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .fretboard {
            display: flex;
            flex-direction: column;
            background: var(--fretboard-color);
            width: 100%;
            border: 2px solid #444;
            position: relative;
        }

        .string {
            display: flex;
            height: 40px;
            position: relative;
            width: 100%;
        }
        
        .string::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: var(--string-thickness, 2px); background-color: #888;
            z-index: 1; pointer-events: none;
        }
        .string:nth-child(1) { --string-thickness: 1px; } 
        .string:nth-child(2) { --string-thickness: 1.5px; }
        .string:nth-child(3) { --string-thickness: 2px; }
        .string:nth-child(4) { --string-thickness: 2.5px; }
        .string:nth-child(5) { --string-thickness: 3px; }
        .string:nth-child(6) { --string-thickness: 3.5px; }

        .note-fret {
            flex: 1;
            border-right: 2px solid var(--fret-wire-color);
            display: flex; align-items: center; justify-content: center;
            position: relative; 
            cursor: pointer;
            min-width: 0;
        }
        
        .note-fret:hover { background-color: rgba(255,255,255,0.05); }

        .note-fret.nut {
            flex: 0 0 35px;
            background-color: #222; 
            border-right: 4px solid #ddd;
            z-index: 10;
        }

        /* Pearl inlays sit between the strings, like on a real neck:
           one dot between the G and D strings, two dots at frets 12 and 24 */
        .note-fret.inlay::after {
            content: ''; position: absolute; left: 50%; bottom: 0;
            width: clamp(6px, 1vw, 12px); height: clamp(6px, 1vw, 12px);
            transform: translate(-50%, 50%);
            border-radius: 50%; z-index: 1; pointer-events: none;
            background: radial-gradient(circle at 35% 35%, #b9ab90 0%, #8c7f68 60%, #6b604e 100%);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 6px rgba(242, 163, 58, 0.15);
        }

        .note-display {
            width: 2.5vw; height: 2.5vw;
            max-width: 28px; max-height: 28px;
            min-width: 18px; min-height: 18px;
            border-radius: 50%;
            background: var(--note-bg); color: var(--note-text);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.7rem;
            z-index: 2; opacity: 0;
            transition: transform 0.1s, opacity 0.2s;
            transform: scale(0.5); pointer-events: none;
        }

        .note-display.visible { opacity: 1; transform: scale(1); }
        .note-display.playing { 
            transform: scale(1.3); background-color: var(--playing-note-bg) !important;
            color: var(--playing-note-text) !important; box-shadow: 0 0 14px var(--accent); 
            z-index: 100;
        }
        .note-display.root {
            background-color: var(--root-note-bg); color: var(--root-note-text);
            box-shadow: 0 0 8px var(--root-note-bg); z-index: 3;
        }
        .note-display.scale-note {
            background-color: var(--scale-note-bg); color: var(--scale-note-text);
        }

        .note-fret.in-box { background-color: var(--box-bg-tint); }
        .note-fret.box-left { border-left: 2px solid var(--box-border-color) !important; }
        .note-fret.box-right { border-right: 2px solid var(--box-border-color) !important; }
        .note-fret.box-top { border-top: 2px solid var(--box-border-color) !important; }
        .note-fret.box-bottom { border-bottom: 2px solid var(--box-border-color) !important; }

        .fret-numbers { display: flex; width: 100%; }
        .fret-number { 
            flex: 1; text-align: center; color: #666; 
            font-size: 0.7rem; box-sizing: border-box;
            border-right: 2px solid transparent; padding-top: 3px;
            min-width: 0;
        }
        .fret-number.marker { color: #d8d2c4; font-weight: bold; }
        .fret-number-spacer {
            flex: 0 0 35px;
            border-right: 4px solid transparent;
        }

        .top-bar { display: flex; flex-direction: column; align-items: center; width: 100%; }

        /* ---------- Scales / Chords tabs ---------- */
        .mode-tabs {
            display: inline-flex; background: #2a2a2a; border: 1px solid #444;
            border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 14px;
        }
        .mode-tab {
            background: transparent; color: #bbb; border: none; border-radius: 6px;
            padding: 8px 22px; font-family: inherit; font-size: 0.95rem; font-weight: bold; cursor: pointer;
        }
        .mode-tab:hover { color: #fff; }
        .mode-tab.active { background: var(--accent); color: var(--accent-text); }
        body.mode-scales .chords-only, body.mode-chords .scales-only { display: none !important; }

        .chord-info { width: 100%; margin: -4px 0 10px; font-size: 0.85rem; color: #aaa; min-height: 1.2em; }
        .chord-info strong { color: #eee; }
        .chord-info .shape-order { color: #777; }
        .chord-info .tab-shape { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); letter-spacing: 1px; }

        /* Strings left out of a chord shape get an X at the nut */
        .note-fret.nut.muted::before {
            content: '\00d7'; position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; z-index: 5;
            color: #e07a5f; font-size: 1.2rem; font-weight: bold; pointer-events: none;
        }
        .note-fret.nut.muted .note-display { opacity: 0 !important; }

        /* --- Draggable focus window --- */
        .fretboard-container { position: relative; }

        /* The fretboard scrolls sideways on narrow screens instead of squashing */
        .fretboard-scroll { width: 100%; }
        .swipe-hint { display: none; }

        /* ---------- Scale shape selector ---------- */
        .shape-bar {
            width: 100%; display: flex; align-items: center; flex-wrap: wrap;
            gap: 6px; margin-bottom: 10px;
        }
        .shape-bar-label { font-size: 0.7rem; color: #aaa; font-weight: bold; margin-right: 4px; }
        .shape-btn {
            background: transparent; color: #ccc; border: 1px solid #555; border-radius: 4px;
            min-height: 36px; min-width: 44px; padding: 2px 12px; font-family: inherit;
            font-size: 0.9rem; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            line-height: 1.1;
        }
        .shape-btn small { font-size: 0.6rem; font-weight: normal; color: #888; }
        .shape-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.06); }
        .shape-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(242, 163, 58, 0.1); }
        .shape-btn.active small { color: var(--accent); }
        .shape-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .shape-note { font-size: 0.75rem; color: #888; margin-left: 6px; }
        @media (max-width: 600px) {
            .shape-btn { min-width: 38px; padding: 2px 6px; font-size: 0.85rem; }
            .shape-btn small { font-size: 0.55rem; }
        }

        /* Notes outside the selected shape stay visible but fade back */
        .note-display.visible.dim { opacity: 0.08; box-shadow: none; }
        .note-display.visible.dim.playing { opacity: 1; }
        .fret-numbers { padding-bottom: 18px; }

        .range-window {
            position: absolute; top: 0; left: 0;
            pointer-events: none; z-index: 50;
        }

        .range-window .rw-edge {
            position: absolute; top: 0; width: 14px;
            cursor: ew-resize; pointer-events: auto; touch-action: none;
        }
        .range-window .rw-left  { left: 0;  transform: translateX(-50%); }
        .range-window .rw-right { right: 0; transform: translateX(50%); }
        .range-window .rw-edge::after {
            content: ''; position: absolute; left: 6px; top: 0; bottom: 0;
            width: 2px; background: var(--box-border-color); opacity: 0.85;
        }
        .range-window .rw-edge:hover::after,
        .range-window.dragging .rw-edge::after {
            opacity: 1; box-shadow: 0 0 8px var(--box-border-color);
        }
        /* Grip handle in the middle of each edge, so it's clear the window can be resized */
        .range-window .rw-edge::before {
            content: ''; position: absolute; left: 50%; top: 50%; z-index: 1;
            width: 10px; height: 30px; transform: translate(-50%, -50%);
            border-radius: 5px; background: var(--accent);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            background-image: repeating-linear-gradient(to bottom, transparent 0 9px, rgba(30, 22, 8, 0.55) 9px 11px);
            background-size: 4px 100%; background-repeat: no-repeat; background-position: center;
        }
        .range-window .rw-edge:hover::before,
        .range-window.dragging .rw-edge::before { box-shadow: 0 0 8px var(--accent); }
        @media (pointer: coarse) { .range-window .rw-edge { width: 26px; } .range-window .rw-edge::after { left: 12px; } }

        .range-window .rw-bar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 15px;
            background: rgba(242, 163, 58, 0.12);
            border: 1px solid var(--box-border-color);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: bold; letter-spacing: 1px;
            color: var(--box-border-color);
            cursor: grab; pointer-events: auto; touch-action: none;
        }
        .range-window .rw-bar:hover { background: rgba(242, 163, 58, 0.3); }
        .range-window.dragging .rw-bar { cursor: grabbing; background: rgba(242, 163, 58, 0.35); }

        /* ---------- Phones (portrait) ---------- */
        @media (max-width: 700px) and (min-height: 501px) {
            body { padding: 12px 12px 24px; }
            h1 { font-size: 1.15rem; margin: 2px 0 10px; text-align: center; }
            .mode-tabs { margin-bottom: 10px; }
            .mode-tab { padding: 8px 28px; font-size: 1rem; }

            /* Controls as a tidy two-column grid with thumb-sized targets */
            .controls {
                display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
                align-items: end; padding: 12px;
            }
            .control-group { min-width: 0; }
            .control-group:has(#scaleType), .control-group:has(#chordType),
            .control-group:has(#tempoInput) { grid-column: 1 / -1; }
            label { font-size: 0.75rem; }
            /* 16px text stops iPhones zooming in when a box is tapped */
            select, input[type="number"] { height: 40px; font-size: 16px; }
            .tempo-row input[type="range"] { flex: 1; width: auto; height: 8px; }
            .tempo-row input[type="number"] { width: 72px; }
            input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; }
            button.action-btn { height: 44px; font-size: 1rem; min-width: 0; width: 100%; }

            /* Shape buttons in one row that scrolls sideways */
            .shape-bar {
                flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
                padding-bottom: 2px; scroll-padding: 0 12px;
            }
            .shape-bar::-webkit-scrollbar { display: none; }
            .shape-btn { flex: 0 0 auto; min-height: 44px; }
            .shape-note { flex: 0 0 auto; }

            /* Fretboard: keep frets wide enough to read and tap, and scroll sideways */
            .fretboard-scroll {
                /* run to the screen edges, with room so the drag handles aren't clipped */
                margin: 0 -12px; padding: 0 14px; width: calc(100% + 24px);
                overflow-x: auto; -webkit-overflow-scrolling: touch;
                overscroll-behavior-x: contain; scrollbar-width: thin;
                scrollbar-color: #555 transparent;
            }
            .fretboard-container { min-width: calc(32px + 24 * 40px); }
            .note-fret.nut, .fret-number-spacer { flex-basis: 32px; }
            .string { height: 42px; }
            .note-display { width: 28px; height: 28px; max-width: none; max-height: none; font-size: 0.75rem; }
            .note-fret.inlay::after { width: 9px; height: 9px; }
            .fret-number { font-size: 0.75rem; }
            .range-window .rw-bar { height: 22px; font-size: 0.7rem; }
            .fret-numbers { padding-bottom: 26px; }

            .swipe-hint {
                display: block; margin: 4px 0 0; font-size: 0.75rem; color: #888; text-align: center;
            }
        }

        /* ---------- Phones (landscape): keep the fretboard on screen ---------- */
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 6px 16px 16px; }
            h1 { font-size: 0.95rem; margin: 0 0 6px; }
            /* title and tabs share one row */
            .top-bar { flex-direction: row; justify-content: center; gap: 16px; margin-bottom: 6px; }
            .top-bar h1 { margin: 0; }
            .mode-tabs { margin-bottom: 0; padding: 2px; }
            .mode-tab { padding: 3px 14px; font-size: 0.8rem; }
            .chord-info { margin: -2px 0 4px; font-size: 0.75rem; }
            .chord-info .shape-order { display: none; }
            .controls { padding: 6px 10px; gap: 8px; margin-bottom: 6px; flex-wrap: nowrap; }
            .control-group { min-width: 0; }
            label { margin-bottom: 2px; font-size: 0.65rem; }
            select, input[type="number"] { font-size: 16px; height: 34px; padding: 2px 6px; }
            .tempo-row { gap: 6px; }
            .tempo-row input[type="range"] { width: clamp(56px, 10vw, 110px); }
            .tempo-row input[type="number"] { width: 58px; }
            .control-group:has(#tempoInput) { flex: 0 0 auto; }
            .control-group:has(#tuningSelect), .control-group:has(#scaleType),
            .control-group:has(#chordType) { flex: 1 1 0; }
            button.action-btn { height: 34px; min-width: 0; padding: 0 12px; white-space: nowrap; }
            .shape-bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-bottom: 6px; }
            .shape-bar::-webkit-scrollbar { display: none; }
            .shape-btn { flex: 0 0 auto; min-height: 36px; padding: 1px 10px; }
            .string { height: 30px; }
            .fret-numbers { padding-bottom: 20px; }
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Fretboard Shredder - Guitar Scale &amp; Chord Trainer</h1>

        <div class="mode-tabs" role="tablist" aria-label="Practice mode">
            <button class="mode-tab active" role="tab" aria-selected="true" data-mode="scales">Scales</button>
            <button class="mode-tab" role="tab" aria-selected="false" data-mode="chords">Chords</button>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label>Tuning</label>
            <select id="tuningSelect"></select>
        </div>

        <div class="control-group">
            <label>Root</label>
            <select id="rootNote"></select>
        </div>
        <div class="control-group scales-only">
            <label>Scale</label>
            <select id="scaleType"></select>
        </div>
        <div class="control-group chords-only">
            <label>Chord</label>
            <select id="chordType"></select>
        </div>
        
        <div class="control-group">
            <label for="tempoInput">Tempo (BPM)</label>
            <div class="tempo-row">
                <input type="range" id="tempoSlider" min="60" max="300" value="120" aria-label="Tempo slider">
                <input type="number" id="tempoInput" min="60" max="300" step="1" value="120" title="Type a tempo between 60 and 300 BPM">
            </div>
        </div>

        <button class="action-btn toggle" id="loopBtn" aria-pressed="false" onclick="toggleLoop()" title="Play up and back down the run until you press Stop">🔁 Loop</button>
        <button class="action-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
    </div>

    <div class="shape-bar" id="shapeBar" role="group" aria-label="Scale shape">
        <span class="shape-bar-label">Shape</span>
        <button class="shape-btn active" data-shape="all" aria-pressed="true">Full neck</button>
        <!-- Numbered shape buttons are added by the script: one per position up to fret 24 -->
        <span class="shape-note" id="shapeNote" hidden>Shapes are available in Standard, E♭ Standard and D Standard tuning</span>
    </div>
    <p class="chord-info chords-only" id="chordInfo"></p>

    <div class="fretboard-scroll" id="fretboardScroll">
    <div class="fretboard-container">
        <div class="fretboard" id="fretboard"></div>
        <div class="fret-numbers" id="fretNumbers"></div>

        <div class="range-window" id="rangeWindow">
            <div class="rw-edge rw-left" title="Drag to move the start fret"></div>
            <div class="rw-edge rw-right" title="Drag to move the end fret"></div>
            <div class="rw-bar" title="Drag to slide the focus window along the neck"></div>
        </div>
    </div>
    </div>
    <p class="swipe-hint">Swipe the fretboard to see all 24 frets</p>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let activeVoices = [];   // notes currently sounding: { source, gain }
        let reverbNode = null;
        let reverbWetGain = null;

        // Convolution reverb using programmatically generated impulse response
        function initReverb() {
            const duration = 1.6;
            const decay = 2.8;
            const sr = audioCtx.sampleRate;
            const length = Math.floor(sr * duration);
            const impulse = audioCtx.createBuffer(2, length, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    // Exponentially decaying noise — standard IR approximation
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
            reverbWetGain = audioCtx.createGain();
            reverbWetGain.gain.value = 0.18; // subtle room presence
            reverbNode.connect(reverbWetGain);
            reverbWetGain.connect(audioCtx.destination);
        }

        // Quickly fade out everything that's still ringing
        function silenceAll() {
            const now = audioCtx.currentTime;
            activeVoices.forEach(({ source, gain }) => {
                try {
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.setValueAtTime(gain.gain.value, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);
                    source.stop(now + 0.018);
                } catch (e) { /* already stopped */ }
            });
            activeVoices = [];
        }

        // keepRinging: let earlier notes keep sounding (used to strum a chord)
        function playTone(midiNote, keepRinging = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!reverbNode) initReverb();

            // Smooth fade-out of the previous note(s)
            if (!keepRinging) silenceAll();

            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = Math.floor(sampleRate * 3.5);
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);
            const period = Math.round(sampleRate / frequency);

            // String-specific character: bass strings are warmer/slower-decaying
            let decay, lpCoeff;
            if (midiNote < 50) {         // Low E, A strings
                decay = 0.9968; lpCoeff = 0.46;
            } else if (midiNote < 62) {  // D, G strings
                decay = 0.9930; lpCoeff = 0.34;
            } else {                     // B, high e strings
                decay = 0.9880; lpCoeff = 0.24;
            }

            // Filtered noise burst: smoother initial transient than raw white noise
            for (let i = 0; i < period; i++) data[i] = Math.random() * 2 - 1;
            const pickSmooth = 0.28;
            for (let i = 1; i < period; i++) {
                data[i] = data[i] * (1 - pickSmooth) + data[i - 1] * pickSmooth;
            }

            // Karplus-Strong feedback loop with tuned low-pass per string
            for (let i = period; i < bufferSize; i++) {
                const p1 = data[i - period];
                const p2 = i - period - 1 >= 0 ? data[i - period - 1] : 0;
                data[i] = decay * ((1 - lpCoeff) * p1 + lpCoeff * p2);
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const masterGain = audioCtx.createGain();

            // Clean tone: body warmth + presence boost + gentle air cut
            const bodyWarmth = audioCtx.createBiquadFilter();
            bodyWarmth.type = 'peaking';
            bodyWarmth.frequency.value = 260;
            bodyWarmth.gain.value = 4;
            bodyWarmth.Q.value = 1.5;

            const presence = audioCtx.createBiquadFilter();
            presence.type = 'peaking';
            presence.frequency.value = 3200;
            presence.gain.value = 3;
            presence.Q.value = 2.0;

            const airCut = audioCtx.createBiquadFilter();
            airCut.type = 'highshelf';
            airCut.frequency.value = 7500;
            airCut.gain.value = -4;

            source.connect(bodyWarmth);
            bodyWarmth.connect(presence);
            presence.connect(airCut);
            airCut.connect(masterGain);
            masterGain.gain.value = 0.88;

            // Dry signal to output
            masterGain.connect(audioCtx.destination);
            // Wet reverb send
            masterGain.connect(reverbNode);

            // Strummed notes sound together, so each one is quieter
            if (keepRinging) masterGain.gain.value *= 0.42;

            source.start();
            const voice = { source, gain: masterGain };
            activeVoices.push(voice);
            source.onended = () => { activeVoices = activeVoices.filter(v => v !== voice); };
        }

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        const tunings = {
            "Standard (E)": [64, 59, 55, 50, 45, 40],
            "Drop D": [64, 59, 55, 50, 45, 38],
            "Drop C": [62, 57, 53, 48, 43, 36], // ADDED DROP C
            "Eb Standard": [63, 58, 54, 49, 44, 39],
            "D Standard": [62, 57, 53, 48, 43, 38],
            "Open G": [62, 59, 55, 50, 43, 38]
        };
        
        const scales = {
            "Major": [0, 2, 4, 5, 7, 9, 11],
            "Minor (Natural)": [0, 2, 3, 5, 7, 8, 10],
            "Pentatonic Major": [0, 2, 4, 7, 9],
            "Pentatonic Minor": [0, 3, 5, 7, 10],
            "Blues": [0, 3, 5, 6, 7, 10],
            "Harmonic Minor": [0, 2, 3, 5, 7, 8, 11],
            "Dorian": [0, 2, 3, 5, 7, 9, 10],
            "Phrygian": [0, 1, 3, 5, 7, 8, 10],
            "Phrygian Dominant": [0, 1, 4, 5, 7, 8, 10],
            "Lydian": [0, 2, 4, 6, 7, 9, 11],
            "Mixolydian": [0, 2, 4, 5, 7, 9, 10],
            "Locrian": [0, 1, 3, 5, 6, 8, 10]
        };

        const numberOfFrets = 24;
        const singleInlayFrets = [3, 5, 7, 9, 15, 17, 19, 21];
        const doubleInlayFrets = [12, 24];
        const fretboardEl = document.getElementById('fretboard');
        const fretNumbersEl = document.getElementById('fretNumbers');
        const rootSelect = document.getElementById('rootNote');
        const scaleSelect = document.getElementById('scaleType');
        const tuningSelect = document.getElementById('tuningSelect');
        // The practice range, set by dragging the window on the fretboard
        let rangeMin = 0, rangeMax = 12;
        const playBtn = document.getElementById('playBtn');
        const loopBtn = document.getElementById('loopBtn');
        const tempoSlider = document.getElementById('tempoSlider');
        const tempoInput = document.getElementById('tempoInput');
        const rangeWindowEl = document.getElementById('rangeWindow');
        const fretboardScroll = document.getElementById('fretboardScroll');

        // On narrow screens the fretboard scrolls sideways; these keep the action in view.
        function isBoardScrollable() {
            return fretboardScroll.scrollWidth > fretboardScroll.clientWidth + 1;
        }
        // Scroll so the frets from left to right (page x positions) are visible, centring if needed
        function revealSpan(left, right, smooth = true) {
            if (!isBoardScrollable()) return;
            const view = fretboardScroll.getBoundingClientRect();
            const margin = 24;
            if (left >= view.left + margin && right <= view.right - margin) return;
            const centre = (left + right) / 2 - view.left + fretboardScroll.scrollLeft;
            fretboardScroll.scrollTo({ left: centre - view.width / 2, behavior: smooth ? 'smooth' : 'auto' });
        }
        function revealRange(smooth = true) {
            const r = rangeWindowEl.getBoundingClientRect();
            revealSpan(r.left, r.right, smooth);
        }
        function revealNote(noteEl) {
            const r = noteEl.getBoundingClientRect();
            revealSpan(r.left, r.right);
        }
        const rwBar = rangeWindowEl.querySelector('.rw-bar');
        const rwLeft = rangeWindowEl.querySelector('.rw-left');
        const rwRight = rangeWindowEl.querySelector('.rw-right');

        let isPlaying = false;
        let shouldStop = false;

        /* ---------- Scales / Chords mode ---------- */
        let mode = 'scales';
        const chordSelect = document.getElementById('chordType');
        const chordInfo = document.getElementById('chordInfo');
        const modeTabs = Array.from(document.querySelectorAll('.mode-tab'));
        let activeMuted = [];   // strings (display index) left out of the selected chord shape

        const CHORD_TYPES = {
            "Major":            { iv: [0, 4, 7] },
            "Minor":            { iv: [0, 3, 7] },
            "7":                { iv: [0, 4, 7, 10], optional: [7] },
            "Major 7":          { iv: [0, 4, 7, 11], optional: [7] },
            "Minor 7":          { iv: [0, 3, 7, 10], optional: [7] },
            "6":                { iv: [0, 4, 7, 9], optional: [7] },
            "Minor 6":          { iv: [0, 3, 7, 9], optional: [7] },
            "9":                { iv: [0, 4, 7, 10, 2], optional: [7] },
            "Add 9":            { iv: [0, 4, 7, 2], optional: [7] },
            "Sus 2":            { iv: [0, 2, 7] },
            "Sus 4":            { iv: [0, 5, 7] },
            "Diminished":       { iv: [0, 3, 6] },
            "Diminished 7":     { iv: [0, 3, 6, 9] },
            "Minor 7♭5":   { iv: [0, 3, 6, 10] },
            "Augmented":        { iv: [0, 4, 8] },
            "5 (Power chord)":  { iv: [0, 7], power: true }
        };

        function chordVoicings(open, root, type, maxFret = 24) {
            const def = CHORD_TYPES[type];
            const pc = p => ((p % 12) + 12) % 12;
            const tones = def.iv.map(i => pc(root + i));
            const required = def.iv.filter(i => !(def.optional || []).includes(i)).map(i => pc(root + i));
            const nStr = open.length;
            const best = new Map();   // key -> {frets, score}

            for (let w = 1; w <= maxFret - 3; w++) {
                // Options per string: muted, open (only near the nut), or a chord tone in frets w..w+3
                const opts = open.map(o => {
                    const list = [-1];
                    if (w <= 3 && tones.includes(pc(o))) list.push(0);
                    for (let f = w; f <= w + 3 && f <= maxFret; f++) if (tones.includes(pc(o + f))) list.push(f);
                    return list;
                });
                const cur = new Array(nStr);
                (function rec(s) {
                    if (s === nStr) { consider(cur.slice()); return; }
                    for (const f of opts[s]) { cur[s] = f; rec(s + 1); }
                })(0);
            }

            function consider(frets) {
                const played = frets.map((f, s) => f >= 0 ? s : -1).filter(s => s >= 0);
                if (played.length === 0) return;
                const lo = played[0], hi = played[played.length - 1];
                // Strings between the lowest and highest played string must all be played
                if (played.length !== hi - lo + 1) return;
                if (def.power) { if (played.length < 2 || played.length > 3 || lo > 2) return; }
                else if (played.length < 4) return;
                // Root in the bass
                if (pc(open[lo] + frets[lo]) !== pc(root)) return;
                const notes = played.map(s => pc(open[s] + frets[s]));
                if (!required.every(t => notes.includes(t))) return;
                // Power chords: only root and fifth, in that order up from the bass
                if (def.power && notes.some(n => !tones.includes(n))) return;

                const fretted = played.filter(s => frets[s] > 0);
                const fr = fretted.map(s => frets[s]);
                const minF = fr.length ? Math.min(...fr) : 0, maxF = fr.length ? Math.max(...fr) : 0;
                if (maxF - minF > 3) return;
                // Open strings only alongside low-position shapes
                if (played.some(s => frets[s] === 0) && maxF > 4) return;

                // Fingers: a barre at the lowest fret counts as one finger
                const atMin = fretted.filter(s => frets[s] === minF);
                let fingers = fretted.length;
                let barre = false;
                if (atMin.length >= 2 && fretted.length > 4 - 0) {
                    // need a barre: every played string from the first to last barred string must be at >= minF
                    const a = atMin[0], b = atMin[atMin.length - 1];
                    for (let s = a; s <= b; s++) if (frets[s] >= 0 && frets[s] < minF) return;
                    fingers = fretted.length - atMin.length + 1;
                    barre = true;
                } else if (atMin.length >= 2) {
                    // barre optional; use it if it lowers the finger count below 5
                    const a = atMin[0], b = atMin[atMin.length - 1];
                    let ok = true;
                    for (let s = a; s <= b; s++) if (frets[s] >= 0 && frets[s] < minF) ok = false;
                    if (fingers > 4 && ok) { fingers = fretted.length - atMin.length + 1; barre = true; }
                }
                if (fingers > 4) return;

                // Score: fuller chords, bass on a low string, doubled root, easy fingering
                let score = played.length * 3;
                if (lo === 0) score += 3; else if (lo === 1) score += 2;
                score += notes.filter(n => n === pc(root)).length;
                if (notes.length && def.iv.length >= 3 && !notes.includes(pc(root + 7)) && tones.includes(pc(root + 7))) score -= 2;
                score -= fingers * 0.5 + (maxF - minF) * 0.7;
                if (barre) score -= 0.5;
                // Familiar open chords near the nut get a boost
                if (played.some(s => frets[s] === 0) && fingers <= 3) score += 2;
                // Leaving the top string unplayed is less common for full chords
                if (!def.power && hi < nStr - 1) score -= 1;
                // the top string should not be a muted gap in a low-position chord
                const pos = fr.length ? minF : 0;
                const key = frets.join(',');
                if (!best.has(key)) best.set(key, { frets, score, pos, lo, maxF });
            }

            // Keep the best shape per position, then thin to a spread up the neck
            const all = [...best.values()].sort((a, b) => b.score - a.score);
            const byPos = new Map();
            for (const v of all) {
                const p = v.frets.some(f => f === 0) ? 0 : v.pos;
                if (!byPos.has(p)) byPos.set(p, v);
            }
            let list = [...byPos.values()].sort((a, b) => a.pos - b.pos || b.score - a.score);
            // Drop weak shapes that sit right next to a stronger one
            const kept = [];
            for (const v of list) {
                const near = kept.find(k => Math.abs(k.pos - v.pos) <= 1);
                if (near) { if (v.score > near.score) kept[kept.indexOf(near)] = v; }
                else kept.push(v);
            }
            return kept.sort((a, b) => a.pos - b.pos);
        }

        // Chord shapes in the same form as scale shapes, plus which strings are muted
        function chordShapes() {
            const open = tunings[tuningSelect.value].slice().reverse();
            return chordVoicings(open, parseInt(rootSelect.value), chordSelect.value, numberOfFrets).map(v => {
                const notes = [], muted = [];
                v.frets.forEach((f, st) => { if (f >= 0) notes.push([st, f]); else muted.push(st); });
                const frets = notes.map(([, f]) => f);
                return { notes, muted, frets: v.frets, lo: Math.min(...frets), hi: Math.max(...frets) };
            });
        }

        function setMode(newMode) {
            if (newMode === mode) return;
            mode = newMode;
            document.body.classList.toggle('mode-scales', mode === 'scales');
            document.body.classList.toggle('mode-chords', mode === 'chords');
            modeTabs.forEach(t => {
                const on = t.dataset.mode === mode;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on);
            });
            if (isPlaying) shouldStop = true;
            loopBtn.title = mode === 'chords'
                ? 'Repeat the chord until you press Stop'
                : 'Play up and back down the run until you press Stop';
            // Chords open on their first shape; scales open on the full neck
            selectShape(mode === 'chords' ? 0 : null);
        }

        function updateChordInfo() {
            if (mode !== 'chords') return;
            const root = parseInt(rootSelect.value);
            const def = CHORD_TYPES[chordSelect.value];
            const names = def.iv.map(i => noteNames[(root + i) % 12]);
            const chordName = def.power ? noteNames[root] + '5 power chord' : noteNames[root] + ' ' + chordSelect.value;
            let text = '<strong>' + chordName + '</strong>: ' + names.join(' \u00b7 ');
            if (activeShape !== null) {
                const sh = allShapes()[activeShape];
                if (sh) text += ' &nbsp; Shape <span class="tab-shape">' + sh.frets.map(f => f < 0 ? 'x' : f).join(' ') + '</span> <span class="shape-order">(lowest string \u2192 highest)</span>';
            }
            chordInfo.innerHTML = text;
        }

        /* ---------- Scale shapes ---------- */
        const shapeBar = document.getElementById('shapeBar');
        const fullNeckBtn = shapeBar.querySelector('.shape-btn[data-shape="all"]');
        const shapeNote = document.getElementById('shapeNote');
        let activeShape = null;      // null = full neck, otherwise an index into allShapes()
        let activeShapeKeys = null;  // Set of "string-fret" for the notes in the active shape

        // Shapes follow standard-tuning fingerings, so they're offered only when the strings
        // are a fourth apart with a major third between G and B (Standard, Eb and D Standard).
        function shapesSupported() {
            const low = tunings[tuningSelect.value].slice().reverse();
            return low.slice(1).map((m, i) => m - low[i]).join(',') === '5,5,5,4,5';
        }

        // Works out one of the five shapes for any root and scale.
        // open: open-string pitches, lowest string first. Returns notes as [string, fret]
        // pairs (string 0 = lowest) plus the lowest and highest fret used.
        function computeShape(open, root, intervals, k) {
            const pentOffsets = intervals.includes(4) ? [0, 2, 4, 7, 9] : [0, 3, 5, 7, 10];
            const pentPcs = pentOffsets.map(o => (root + o) % 12);
            const scalePcs = intervals.map(i => (root + i) % 12);
            const pc = p => ((p % 12) + 12) % 12;
            const rootFret = pc(root - open[0]);

            // 1. Window: the pentatonic box starting on pentatonic degree k on the lowest string,
            //    two notes per string.
            let start = open[0] + rootFret + pentOffsets[k];
            let lo, hi;
            for (let attempt = 0; attempt < 3; attempt++) {
                const seq = [];
                for (let p = start; seq.length < open.length * 2; p++) if (pentPcs.includes(pc(p))) seq.push(p);
                const frets = seq.map((p, i) => p - open[Math.floor(i / 2)]);
                lo = Math.min(...frets); hi = Math.max(...frets);
                if (lo < 0) start += 12;
                else if (hi > 24) start -= 12;
                else break;
            }

            // 2. Fill the window with the chosen scale's notes, lowest string first, moving to the
            //    next string once a note no longer fits. One fret of stretch either side if needed.
            const notes = [];
            let s = 0;
            let p = open[0] + lo;
            while (!scalePcs.includes(pc(p)) || p - open[0] < lo) p++;
            for (; s < open.length; p++) {
                if (!scalePcs.includes(pc(p))) continue;
                const f = p - open[s];
                const hasNext = s + 1 < open.length;
                const fn = hasNext ? p - open[s + 1] : null;
                const full = notes.filter(n => n[0] === s).length >= 3;   // max 3 notes per string
                if (full && !hasNext) break;
                if (full && fn >= Math.max(0, lo - 1)) notes.push([++s, fn]);
                else if (f >= lo && f <= hi && !full) notes.push([s, f]);
                else if (hasNext && fn >= lo && fn <= hi) notes.push([++s, fn]);
                else if (f === hi + 1 && f <= 24 && !full) notes.push([s, f]);
                else if (hasNext && fn === lo - 1 && fn >= 0) notes.push([++s, fn]);
                else if (!hasNext && f > hi + 1) break;
                else if (hasNext && f > hi + 1) s++;   // nothing reachable: move on (rare)
            }
            const used = notes.map(n => n[1]);
            return { notes, lo: Math.min(...used), hi: Math.max(...used) };
        }

        // Every complete position of the five shapes between the nut and fret 24, in order
        // up the neck. The pattern repeats every five: shape 6 is shape 1 an octave higher.
        function allShapes() {
            if (mode === 'chords') return chordShapes();
            if (!shapesSupported()) return [];
            const open = tunings[tuningSelect.value].slice().reverse();
            const root = parseInt(rootSelect.value);
            const intervals = scales[scaleSelect.value];
            const found = [];
            for (let k = 0; k < 5; k++) {
                const base = computeShape(open, root, intervals, k);
                for (let shift = -24; shift <= 24; shift += 12) {
                    const lo = base.lo + shift, hi = base.hi + shift;
                    // Only complete shapes: skip any position that would run off either end of the neck
                    if (lo < 0 || hi > numberOfFrets) continue;
                    found.push({ notes: base.notes.map(([st, f]) => [st, f + shift]), lo, hi });
                }
            }
            return found.sort((a, b) => a.lo - b.lo || a.hi - b.hi);
        }

        function updateShapeButtons() {
            const supported = mode === 'chords' || shapesSupported();
            const shapes = allShapes();
            shapeNote.hidden = supported;
            fullNeckBtn.classList.toggle('active', activeShape === null);
            fullNeckBtn.setAttribute('aria-pressed', activeShape === null);

            // Rebuild the numbered buttons (the count depends on the key and scale)
            shapeBar.querySelectorAll('.shape-btn[data-shape]:not([data-shape="all"])').forEach(b => b.remove());
            const shapeBtnsToShow = supported ? shapes.length : 5;   // greyed-out placeholders otherwise
            for (let i = 0; i < shapeBtnsToShow; i++) {
                const btn = document.createElement('button');
                btn.className = 'shape-btn';
                btn.dataset.shape = i;
                btn.textContent = i + 1;
                const hint = document.createElement('small');
                btn.appendChild(hint);
                if (supported) {
                    const sh = shapes[i];
                    hint.textContent = 'frets ' + sh.lo + '\u2013' + sh.hi;
                    btn.title = 'Shape ' + (i + 1) + ', frets ' + sh.lo + ' to ' + sh.hi;
                } else {
                    btn.disabled = true;
                    btn.title = 'Shapes need Standard, E\u266d Standard or D Standard tuning';
                }
                const isActive = i === activeShape;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive);
                shapeBar.insertBefore(btn, shapeNote);
            }
            // In the sideways-scrolling row on phones, keep the selected button visible
            const activeBtn = shapeBar.querySelector('.shape-btn.active');
            if (activeBtn && shapeBar.scrollWidth > shapeBar.clientWidth) {
                const bar = shapeBar.getBoundingClientRect(), b = activeBtn.getBoundingClientRect();
                if (b.left < bar.left || b.right > bar.right) {
                    shapeBar.scrollTo({ left: shapeBar.scrollLeft + (b.left - bar.left) - (bar.width - b.width) / 2, behavior: 'smooth' });
                }
            }
        }

        // Selects a shape (or null for the full neck) and fits the range window to it.
        function selectShape(k) {
            const shapes = allShapes();
            if (k !== null && k >= shapes.length) k = shapes.length ? shapes.length - 1 : null;
            activeShape = k;
            activeShapeKeys = null;
            activeMuted = [];
            if (k !== null) {
                const sh = shapes[k];
                activeShapeKeys = new Set(sh.notes.map(([s, f]) => (5 - s) + '-' + f));
                activeMuted = (sh.muted || []).map(st => 5 - st);
                setRange(sh.lo, sh.hi, true);
            }
            updateShapeButtons();
            updateFretboard();
            updateChordInfo();
            if (k !== null) revealRange();
        }

        // Root, scale or tuning changed: keep the same shape number (roughly the same part of the neck).
        function refreshShape() {
            selectShape(activeShape);
        }

        function init() {
            noteNames.forEach((note, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = note;
                if(note === 'E') option.selected = true; 
                rootSelect.appendChild(option);
            });

            for (const [name, intervals] of Object.entries(scales)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                if(name === 'Minor (Natural)') option.selected = true;
                scaleSelect.appendChild(option);
            }

            for (const name of Object.keys(CHORD_TYPES)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                chordSelect.appendChild(option);
            }
            document.body.classList.add('mode-scales');
            modeTabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

            for (const name of Object.keys(tunings)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                tuningSelect.appendChild(option);
            }

            drawFretboard();
            updateFretboard();

            rootSelect.addEventListener('change', refreshShape);
            scaleSelect.addEventListener('change', refreshShape);
            chordSelect.addEventListener('change', refreshShape);
            tuningSelect.addEventListener('change', () => {
                drawFretboard();
                refreshShape();
            });

            shapeBar.addEventListener('click', e => {
                const btn = e.target.closest('.shape-btn');
                if (!btn || btn.disabled) return;
                selectShape(btn.dataset.shape === 'all' ? null : parseInt(btn.dataset.shape));
            });
            // Left/right arrow keys step through Full neck and each shape (not while typing in a control)
            document.addEventListener('keydown', e => {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                if (e.target.closest('input, select, textarea')) return;
                const count = allShapes().length;
                if (!count) return;
                const order = [null, ...Array.from({ length: count }, (_, i) => i)];
                const i = order.indexOf(activeShape);
                const next = order[(i + (e.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length];
                e.preventDefault();
                selectShape(next);
            });
            updateShapeButtons();

            rwBar.addEventListener('pointerdown', e => beginRangeDrag(e, 'move'));
            rwLeft.addEventListener('pointerdown', e => beginRangeDrag(e, 'left'));
            rwRight.addEventListener('pointerdown', e => beginRangeDrag(e, 'right'));
            [rwBar, rwLeft, rwRight].forEach(el => el.addEventListener('lostpointercapture', endRangeDrag));
            window.addEventListener('pointermove', moveRangeDrag);
            window.addEventListener('pointerup', endRangeDrag);
            window.addEventListener('pointercancel', endRangeDrag);
            window.addEventListener('resize', positionRangeWindow);
            window.addEventListener('load', positionRangeWindow);
            
            // Slider and text box stay in sync
            tempoSlider.addEventListener('input', () => {
                tempoInput.value = tempoSlider.value;
            });
            // While typing, only apply values already in range
            tempoInput.addEventListener('input', () => {
                const v = parseInt(tempoInput.value);
                if (v >= 60 && v <= 300) tempoSlider.value = v;
            });
            // On Enter or leaving the box, clamp to the allowed range
            const commitTempo = () => {
                let v = parseInt(tempoInput.value);
                if (isNaN(v)) v = parseInt(tempoSlider.value);
                v = Math.min(300, Math.max(60, v));
                tempoInput.value = v;
                tempoSlider.value = v;
            };
            tempoInput.addEventListener('change', commitTempo);
            tempoInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { commitTempo(); tempoInput.blur(); }
            });
        }

        function drawFretboard() {
            fretboardEl.innerHTML = '';
            fretNumbersEl.innerHTML = '';
            const currentTuningName = tuningSelect.value || "Standard (E)";
            const currentBaseMidi = tunings[currentTuningName];

            currentBaseMidi.forEach((baseMidi, stringIndex) => {
                const stringRow = document.createElement('div');
                stringRow.classList.add('string');

                for (let fret = 0; fret <= numberOfFrets; fret++) {
                    const currentMidi = baseMidi + fret;
                    const noteIndex = currentMidi % 12;
                    const noteName = noteNames[noteIndex];

                    const fretDiv = document.createElement('div');
                    fretDiv.classList.add('note-fret');
                    if (fret === 0) fretDiv.classList.add('nut');

                    fretDiv.dataset.fret = fret;
                    fretDiv.dataset.string = stringIndex;

                    // Inlay dots: each is drawn on the lower edge of a string row, so it lands
                    // in the gap between that string and the next one down.
                    if (singleInlayFrets.includes(fret) && stringIndex === 2) fretDiv.classList.add('inlay');
                    if (doubleInlayFrets.includes(fret) && (stringIndex === 1 || stringIndex === 3)) fretDiv.classList.add('inlay');

                    const noteDisplay = document.createElement('div');
                    noteDisplay.classList.add('note-display');
                    noteDisplay.dataset.noteIndex = noteIndex; 
                    noteDisplay.dataset.midi = currentMidi;
                    noteDisplay.dataset.fret = fret;
                    noteDisplay.dataset.string = stringIndex;
                    noteDisplay.textContent = noteName;

                    fretDiv.appendChild(noteDisplay);

                    fretDiv.addEventListener('pointerdown', () => {
                        playTone(currentMidi); 
                        noteDisplay.classList.add('playing');
                        setTimeout(() => noteDisplay.classList.remove('playing'), 150);
                    });

                    stringRow.appendChild(fretDiv);
                }
                fretboardEl.appendChild(stringRow);
            });

            const nutSpacer = document.createElement('div');
            nutSpacer.classList.add('fret-number-spacer');
            fretNumbersEl.appendChild(nutSpacer);

            for (let i = 1; i <= numberOfFrets; i++) {
                const numDiv = document.createElement('div');
                numDiv.classList.add('fret-number');
                numDiv.textContent = i;
                if (singleInlayFrets.includes(i) || doubleInlayFrets.includes(i)) numDiv.classList.add('marker');
                fretNumbersEl.appendChild(numDiv);
            }
        }

        function updateFretboard() {
            const rootIndex = parseInt(rootSelect.value);
            const intervals = mode === 'chords' ? CHORD_TYPES[chordSelect.value].iv : scales[scaleSelect.value];
            const allowedIndices = intervals.map(interval => (rootIndex + interval) % 12);
            
            const [minFret, maxFret] = getRange();
            const allFrets = document.querySelectorAll('.note-fret');
            const allNotes = document.querySelectorAll('.note-display');

            allFrets.forEach(fretDiv => {
                const fNum = parseInt(fretDiv.dataset.fret);
                const sNum = parseInt(fretDiv.dataset.string);
                fretDiv.classList.remove('in-box', 'box-left', 'box-right', 'box-top', 'box-bottom', 'muted');
                if (fNum === 0 && activeMuted.includes(sNum)) fretDiv.classList.add('muted');
                if (fNum >= minFret && fNum <= maxFret) {
                    fretDiv.classList.add('in-box');
                    if (fNum === minFret) fretDiv.classList.add('box-left');
                    if (fNum === maxFret) fretDiv.classList.add('box-right');
                    if (sNum === 0) fretDiv.classList.add('box-top');
                    if (sNum === 5) fretDiv.classList.add('box-bottom');
                }
            });

            allNotes.forEach(noteEl => {
                const noteIndex = parseInt(noteEl.dataset.noteIndex);
                noteEl.classList.remove('visible', 'root', 'scale-note', 'dim');
                if (allowedIndices.includes(noteIndex)) {
                    noteEl.classList.add('visible');
                    if (activeShapeKeys && !activeShapeKeys.has(noteEl.dataset.string + '-' + noteEl.dataset.fret)) {
                        noteEl.classList.add('dim');
                    }
                    if (noteIndex === rootIndex) noteEl.classList.add('root');
                    else noteEl.classList.add('scale-note');
                }
            });

            positionRangeWindow();
        }

        /* ---------- Draggable focus window ---------- */
        let dragMode = null;          // 'move' | 'left' | 'right'
        let dragCaptureEl = null;
        let dragFretRects = [];
        let dragStartFret = 0, dragStartMin = 0, dragStartMax = 0;
        let appliedMin = null, appliedMax = null;   // range currently painted on the board

        function getRange() {
            return [rangeMin, rangeMax];
        }

        function setRange(min, max, fromShape = false) {
            min = Math.max(0, Math.min(numberOfFrets, min));
            max = Math.max(min, Math.min(numberOfFrets, max));
            rangeMin = min;
            rangeMax = max;
            if (min === appliedMin && max === appliedMax) return;   // skip redundant repaints mid-drag
            appliedMin = min;
            appliedMax = max;
            // Dragging the window means a custom range, so leave the shape
            if (!fromShape && activeShape !== null) {
                activeShape = null;
                activeShapeKeys = null;
                activeMuted = [];
                updateShapeButtons();
                updateChordInfo();
            }
            updateFretboard();
        }

        function positionRangeWindow() {
            const firstString = fretboardEl.firstElementChild;
            if (!firstString) return;
            const [minFret, maxFret] = getRange();
            const startCell = firstString.querySelector('.note-fret[data-fret="' + minFret + '"]');
            const endCell = firstString.querySelector('.note-fret[data-fret="' + maxFret + '"]');
            if (!startCell || !endCell) return;

            const containerRect = fretboardEl.parentElement.getBoundingClientRect();
            const startRect = startCell.getBoundingClientRect();
            const endRect = endCell.getBoundingClientRect();

            rangeWindowEl.style.left = (startRect.left - containerRect.left) + 'px';
            rangeWindowEl.style.width = (endRect.right - startRect.left) + 'px';
            rangeWindowEl.style.height = (fretboardEl.offsetHeight + fretNumbersEl.offsetHeight) + 'px';
            rwLeft.style.height = fretboardEl.offsetHeight + 'px';
            rwRight.style.height = fretboardEl.offsetHeight + 'px';
            rwBar.textContent = minFret + ' \u2013 ' + maxFret;
        }

        function fretAtClientX(clientX) {
            for (let i = 0; i < dragFretRects.length; i++) {
                if (clientX < dragFretRects[i].right) return i;
            }
            return dragFretRects.length - 1;
        }

        // Fret cell positions; re-measured as the board scrolls during a drag
        function measureFrets() {
            const firstString = fretboardEl.firstElementChild;
            dragFretRects = Array.from(firstString.querySelectorAll('.note-fret'))
                                 .map(cell => cell.getBoundingClientRect());
        }

        // While dragging near the edge of a scrolling board, keep scrolling so the
        // window can be dragged to frets that are off screen.
        let dragPointerX = 0, autoScrollFrame = null;
        function autoScrollStep() {
            autoScrollFrame = null;
            if (!dragMode || !isBoardScrollable()) return;
            const view = fretboardScroll.getBoundingClientRect();
            const zone = 40;
            let dx = 0;
            if (dragPointerX < view.left + zone) dx = -Math.ceil((view.left + zone - dragPointerX) / 4);
            else if (dragPointerX > view.right - zone) dx = Math.ceil((dragPointerX - (view.right - zone)) / 4);
            if (dx) {
                const before = fretboardScroll.scrollLeft;
                fretboardScroll.scrollLeft += dx;
                if (fretboardScroll.scrollLeft !== before) {
                    measureFrets();
                    moveRangeDrag({ clientX: dragPointerX });
                }
            }
            autoScrollFrame = requestAnimationFrame(autoScrollStep);
        }

        function beginRangeDrag(e, mode) {
            const firstString = fretboardEl.firstElementChild;
            if (!firstString || dragMode || e.button !== 0) return;
            e.preventDefault();
            measureFrets();
            dragPointerX = e.clientX;
            if (!autoScrollFrame) autoScrollFrame = requestAnimationFrame(autoScrollStep);
            dragMode = mode;
            [dragStartMin, dragStartMax] = getRange();
            dragStartFret = fretAtClientX(e.clientX);
            rangeWindowEl.classList.add('dragging');
            dragCaptureEl = e.currentTarget;
            dragCaptureEl.setPointerCapture(e.pointerId);
        }

        function moveRangeDrag(e) {
            if (!dragMode) return;
            dragPointerX = e.clientX;
            const fret = fretAtClientX(e.clientX);
            if (dragMode === 'move') {
                const span = dragStartMax - dragStartMin;
                let newMin = dragStartMin + (fret - dragStartFret);
                newMin = Math.max(0, Math.min(numberOfFrets - span, newMin));
                setRange(newMin, newMin + span);
            } else if (dragMode === 'left') {
                setRange(Math.min(fret, dragStartMax), dragStartMax);
            } else {
                setRange(dragStartMin, Math.max(fret, dragStartMin));
            }
        }

        function endRangeDrag(e) {
            if (!dragMode) return;
            dragMode = null;
            if (autoScrollFrame) { cancelAnimationFrame(autoScrollFrame); autoScrollFrame = null; }
            rangeWindowEl.classList.remove('dragging');
            if (dragCaptureEl && dragCaptureEl.hasPointerCapture(e.pointerId)) {
                dragCaptureEl.releasePointerCapture(e.pointerId);
            }
            dragCaptureEl = null;
        }

        function togglePlay() {
            if (isPlaying) shouldStop = true;
            else playScale();
        }

        function toggleLoop() {
            const on = loopBtn.classList.toggle('active');
            loopBtn.setAttribute('aria-pressed', on);
        }

        // Collected fresh before every pass, so changes made while looping
        // (root, scale, tuning, the focus window) take effect next time round.
        function collectScaleNotes() {
            const [minFret, maxFret] = getRange();
            const validNotes = Array.from(document.querySelectorAll('.note-display.visible:not(.dim)'))
                .filter(n => {
                    const f = parseInt(n.dataset.fret);
                    return f >= minFret && f <= maxFret;
                });

            validNotes.sort((a, b) => {
                const stringA = parseInt(a.dataset.string);
                const stringB = parseInt(b.dataset.string);
                const fretA = parseInt(a.dataset.fret);
                const fretB = parseInt(b.dataset.fret);
                if (stringA !== stringB) return stringB - stringA; 
                return fretA - fretB;
            });

            return validNotes;
        }

        const wait = ms => new Promise(r => setTimeout(r, ms));
        const beatMs = () => 60000 / parseInt(tempoSlider.value);

        // Chord shape: strum it, let it ring, then play each note low to high. Loop repeats.
        async function playChordShape() {
            do {
                const notes = collectScaleNotes();   // the shape's notes, low string to high
                if (notes.length === 0) break;
                // Strum: notes 35 ms apart, all left ringing
                for (const note of notes) {
                    if (shouldStop) break;
                    playTone(parseInt(note.dataset.midi), true);
                    note.classList.add('playing');
                    await wait(35);
                }
                if (notes[0]) revealNote(notes[0]);
                await wait(beatMs() * 2);
                notes.forEach(n => n.classList.remove('playing'));
                if (shouldStop) break;
                // Arpeggio: one note per beat
                for (const note of notes) {
                    if (shouldStop) break;
                    playTone(parseInt(note.dataset.midi));
                    note.classList.add('playing');
                    await wait(beatMs());
                    note.classList.remove('playing');
                }
            } while (loopBtn.classList.contains('active') && !shouldStop);
        }

        async function playScale() {
            isPlaying = true;
            shouldStop = false;
            playBtn.textContent = "◼ Stop";
            playBtn.classList.add('stop');

            if (mode === 'chords' && activeShape !== null) {
                await playChordShape();
                silenceAllWhenStopped();
                return finishPlayback();
            }

            // When looping, alternate direction each pass (up, down, up, ...) so the
            // run turns around at each end instead of jumping back to the start.
            let pass = 0;
            do {
                let validNotes = collectScaleNotes();
                if (validNotes.length === 0) break;   // nothing in the window: never spin

                // Each pass plays the full run, so the top and bottom notes
                // are each played twice at the turnaround.
                if (pass % 2 === 1) validNotes.reverse();
                pass++;

                for (let note of validNotes) {
                    if (shouldStop) break;
                    const midi = parseInt(note.dataset.midi);
                    const bpm = parseInt(tempoSlider.value);
                    const delayMs = 60000 / bpm; 
                    playTone(midi); 
                    note.classList.add('playing');
                    revealNote(note);
                    await new Promise(r => setTimeout(r, delayMs)); 
                    note.classList.remove('playing');
                }
            } while (loopBtn.classList.contains('active') && !shouldStop);

            finishPlayback();
        }

        function silenceAllWhenStopped() {
            if (shouldStop) silenceAll();
        }

        function finishPlayback() {
            document.querySelectorAll('.note-display.playing').forEach(n => n.classList.remove('playing'));
            isPlaying = false;
            shouldStop = false;
            playBtn.textContent = "▶ Play";
            playBtn.classList.remove('stop');
        }

        init();
    </script>
</body>
</html>
