<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Shredder</title>
    <style>
        :root {
            /* ORIGINAL THEME COLORS */
            --fretboard-color: #2c241b;  /* Dark Wood */
            --fret-wire-color: #c0c0c0;  /* Silver */
            --note-bg: #eee;             /* White/Grey */
            --note-text: #333;           /* Dark Grey Text */
            --root-note-bg: #3498db;     /* Blue */
            --root-note-text: #fff;
            --scale-note-bg: #e74c3c;    /* Red */
            --scale-note-text: #fff;
            --playing-note-bg: #f1c40f;  /* Yellow */
            --playing-note-text: #000;
            --inlay-color: rgba(255, 255, 255, 0.2);
            --box-border-color: #f1c40f;
            --box-bg-tint: rgba(241, 196, 15, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 5%;
            user-select: none;
            overflow-x: hidden;
        }

        h1 { margin: 5px 0; font-size: 1.5rem; }
        
        .status-bar {
            font-size: 0.8rem; margin-bottom: 15px; 
            background: #222; padding: 4px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid #444; color: #aaa;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }

        .controls {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
        }

        .control-group { display: flex; flex-direction: column; min-width: 60px; }
        label { font-size: 0.7rem; margin-bottom: 4px; color: #aaa; font-weight: bold; }
        
        select, input[type="number"] { 
            padding: 4px 8px; font-size: 0.9rem; border-radius: 4px; border: none; 
            cursor: pointer; height: 30px; width: 100%; background: white; color: black;
        }
        input[type="number"] { width: 50px; }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: #555;
            border-radius: 3px;
            outline: none;
            margin-bottom: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
        }

        button.action-btn {
            background-color: #27ae60; color: white; border: none; padding: 0 15px;
            font-size: 0.9rem; font-weight: bold; border-radius: 4px; cursor: pointer;
            height: 30px; transition: background 0.2s; min-width: 90px;
        }
        button.action-btn:hover { background-color: #2ecc71; }
        button.action-btn.stop { background-color: #c0392b; }
        button.action-btn.stop:hover { background-color: #e74c3c; }

        .fretboard-container {
            width: 100%;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .fretboard {
            display: flex;
            flex-direction: column;
            background: var(--fretboard-color);
            width: 100%;
            border: 2px solid #444;
            position: relative;
        }

        .string {
            display: flex;
            height: 40px;
            position: relative;
            width: 100%;
        }
        
        .string::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: var(--string-thickness, 2px); background-color: #888;
            z-index: 1; pointer-events: none;
        }
        .string:nth-child(1) { --string-thickness: 1px; } 
        .string:nth-child(2) { --string-thickness: 1.5px; }
        .string:nth-child(3) { --string-thickness: 2px; }
        .string:nth-child(4) { --string-thickness: 2.5px; }
        .string:nth-child(5) { --string-thickness: 3px; }
        .string:nth-child(6) { --string-thickness: 3.5px; }

        .note-fret {
            flex: 1;
            border-right: 2px solid var(--fret-wire-color);
            display: flex; align-items: center; justify-content: center;
            position: relative; 
            cursor: pointer;
            min-width: 0;
        }
        
        .note-fret:hover { background-color: rgba(255,255,255,0.05); }

        .note-fret.nut {
            flex: 0 0 35px;
            background-color: #222; 
            border-right: 4px solid #ddd;
            z-index: 10;
        }

        .note-fret.single-fretmark::after {
            content: ''; position: absolute; background: var(--inlay-color);
            width: 1.5vw; height: 1.5vw; max-width: 12px; max-height: 12px;
            border-radius: 50%; z-index: 0;
        }
        .note-fret.double-fretmark::after { 
            content: ''; position: absolute; background: var(--inlay-color);
            width: 1.5vw; height: 1.5vw; max-width: 12px; max-height: 12px;
            border-radius: 50%;
            box-shadow: 0 -20px 0 var(--inlay-color); z-index: 0;
        }

        .note-display {
            width: 2.5vw; height: 2.5vw;
            max-width: 28px; max-height: 28px;
            min-width: 18px; min-height: 18px;
            border-radius: 50%;
            background: var(--note-bg); color: var(--note-text);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.7rem;
            z-index: 2; opacity: 0;
            transition: transform 0.1s, opacity 0.2s;
            transform: scale(0.5); pointer-events: none;
        }

        .note-display.visible { opacity: 1; transform: scale(1); }
        .note-display.playing { 
            transform: scale(1.3); background-color: var(--playing-note-bg) !important;
            color: var(--playing-note-text) !important; box-shadow: 0 0 10px #f1c40f; 
            z-index: 100;
        }
        .note-display.root {
            background-color: var(--root-note-bg); color: var(--root-note-text);
            box-shadow: 0 0 8px var(--root-note-bg); z-index: 3;
        }
        .note-display.scale-note {
            background-color: var(--scale-note-bg); color: var(--scale-note-text);
        }

        .note-fret.in-box { background-color: var(--box-bg-tint); }
        .note-fret.box-left { border-left: 2px solid var(--box-border-color) !important; }
        .note-fret.box-right { border-right: 2px solid var(--box-border-color) !important; }
        .note-fret.box-top { border-top: 2px solid var(--box-border-color) !important; }
        .note-fret.box-bottom { border-bottom: 2px solid var(--box-border-color) !important; }

        .fret-numbers { display: flex; width: 100%; }
        .fret-number { 
            flex: 1; text-align: center; color: #666; 
            font-size: 0.7rem; box-sizing: border-box;
            border-right: 2px solid transparent; padding-top: 3px;
            min-width: 0;
        }
        .fret-number-spacer {
            flex: 0 0 35px;
            border-right: 4px solid transparent;
        }

    </style>
</head>
<body>

    <h1>Fretboard Shredder - Guitar Scale Trainer</h1>
    
    <div class="status-bar">
        <div class="status-dot"></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Tuning</label>
            <select id="tuningSelect"></select>
        </div>

        <div class="control-group">
            <label>Root</label>
            <select id="rootNote"></select>
        </div>
        <div class="control-group">
            <label>Scale</label>
            <select id="scaleType"></select>
        </div>
        
        <div class="control-group">
            <label>Start</label>
            <input type="number" id="startFret" value="0" min="0" max="24">
        </div>
        <div class="control-group">
            <label>End</label>
            <input type="number" id="endFret" value="12" min="0" max="24">
        </div>

        <div class="control-group">
            <label>Tone</label>
            <select id="toneSelect">
                <option value="clean">Clean</option>
                <option value="dist">High Gain</option>
            </select>
        </div>

        <div class="control-group">
            <label>Direction</label>
            <select id="directionSelect">
                <option value="asc">Ascending (↑)</option>
                <option value="desc">Descending (↓)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Tempo: <span id="bpmDisplay">120</span> BPM</label>
            <input type="range" id="tempoSlider" min="60" max="300" value="120">
        </div>

        <button class="action-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
    </div>

    <div class="fretboard-container">
        <div class="fretboard" id="fretboard"></div>
        <div class="fret-numbers" id="fretNumbers"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let currentSource = null;
        let currentGainNode = null;
        let distortionCurve = null;
        let reverbNode = null;
        let reverbWetGain = null;

        // Tanh-based soft clipping — much more musical/tube-like than the old formula
        function makeDistortionCurve(amount) {
            const n = 512;
            const curve = new Float32Array(n);
            const k = amount / 100;
            const norm = Math.tanh(k);
            for (let i = 0; i < n; i++) {
                const x = (i * 2) / n - 1;
                curve[i] = Math.tanh(k * x) / norm;
            }
            return curve;
        }

        // Convolution reverb using programmatically generated impulse response
        function initReverb() {
            const duration = 1.6;
            const decay = 2.8;
            const sr = audioCtx.sampleRate;
            const length = Math.floor(sr * duration);
            const impulse = audioCtx.createBuffer(2, length, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    // Exponentially decaying noise — standard IR approximation
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
            reverbWetGain = audioCtx.createGain();
            reverbWetGain.gain.value = 0.18; // subtle room presence
            reverbNode.connect(reverbWetGain);
            reverbWetGain.connect(audioCtx.destination);
        }

        function playTone(midiNote) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!reverbNode) initReverb();

            // Smooth fade-out of previous note
            if (currentSource && currentGainNode) {
                const now = audioCtx.currentTime;
                currentGainNode.gain.cancelScheduledValues(now);
                currentGainNode.gain.setValueAtTime(currentGainNode.gain.value, now);
                currentGainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.018);
                currentSource.stop(now + 0.018);
            }

            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = Math.floor(sampleRate * 3.5);
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);
            const period = Math.round(sampleRate / frequency);

            // String-specific character: bass strings are warmer/slower-decaying
            let decay, lpCoeff;
            if (midiNote < 50) {         // Low E, A strings
                decay = 0.9968; lpCoeff = 0.46;
            } else if (midiNote < 62) {  // D, G strings
                decay = 0.9930; lpCoeff = 0.34;
            } else {                     // B, high e strings
                decay = 0.9880; lpCoeff = 0.24;
            }

            // Filtered noise burst: smoother initial transient than raw white noise
            for (let i = 0; i < period; i++) data[i] = Math.random() * 2 - 1;
            const pickSmooth = 0.28;
            for (let i = 1; i < period; i++) {
                data[i] = data[i] * (1 - pickSmooth) + data[i - 1] * pickSmooth;
            }

            // Karplus-Strong feedback loop with tuned low-pass per string
            for (let i = period; i < bufferSize; i++) {
                const p1 = data[i - period];
                const p2 = i - period - 1 >= 0 ? data[i - period - 1] : 0;
                data[i] = decay * ((1 - lpCoeff) * p1 + lpCoeff * p2);
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const tone = document.getElementById('toneSelect').value;
            const masterGain = audioCtx.createGain();

            if (tone === 'dist') {
                // High-gain chain: tight HPF → mid scoop/boost → pre-gain → tanh shaper → cab sim
                const preHPF = audioCtx.createBiquadFilter();
                preHPF.type = 'highpass';
                preHPF.frequency.value = 160;
                preHPF.Q.value = 0.6;

                const midBoost = audioCtx.createBiquadFilter();
                midBoost.type = 'peaking';
                midBoost.frequency.value = 900;
                midBoost.gain.value = 10;
                midBoost.Q.value = 1.2;

                const driveGain = audioCtx.createGain();
                driveGain.gain.value = 280;

                const shaper = audioCtx.createWaveShaper();
                if (!distortionCurve) distortionCurve = makeDistortionCurve(500);
                shaper.curve = distortionCurve;
                shaper.oversample = '4x';

                // Multi-stage cabinet sim
                const cabLP = audioCtx.createBiquadFilter();
                cabLP.type = 'lowpass';
                cabLP.frequency.value = 5500;
                cabLP.Q.value = 0.8;

                const cabHP = audioCtx.createBiquadFilter();
                cabHP.type = 'highpass';
                cabHP.frequency.value = 100;
                cabHP.Q.value = 0.7;

                const presence = audioCtx.createBiquadFilter();
                presence.type = 'peaking';
                presence.frequency.value = 3500;
                presence.gain.value = 5;
                presence.Q.value = 2.0;

                source.connect(preHPF);
                preHPF.connect(midBoost);
                midBoost.connect(driveGain);
                driveGain.connect(shaper);
                shaper.connect(cabLP);
                cabLP.connect(cabHP);
                cabHP.connect(presence);
                presence.connect(masterGain);
                masterGain.gain.value = 0.28;
            } else {
                // Clean tone: body warmth + presence boost + gentle air cut
                const bodyWarmth = audioCtx.createBiquadFilter();
                bodyWarmth.type = 'peaking';
                bodyWarmth.frequency.value = 260;
                bodyWarmth.gain.value = 4;
                bodyWarmth.Q.value = 1.5;

                const presence = audioCtx.createBiquadFilter();
                presence.type = 'peaking';
                presence.frequency.value = 3200;
                presence.gain.value = 3;
                presence.Q.value = 2.0;

                const airCut = audioCtx.createBiquadFilter();
                airCut.type = 'highshelf';
                airCut.frequency.value = 7500;
                airCut.gain.value = -4;

                source.connect(bodyWarmth);
                bodyWarmth.connect(presence);
                presence.connect(airCut);
                airCut.connect(masterGain);
                masterGain.gain.value = 0.88;
            }

            // Dry signal to output
            masterGain.connect(audioCtx.destination);
            // Wet reverb send
            masterGain.connect(reverbNode);

            source.start();
            currentSource = source;
            currentGainNode = masterGain;
        }

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        const tunings = {
            "Standard (E)": [64, 59, 55, 50, 45, 40],
            "Drop D": [64, 59, 55, 50, 45, 38],
            "Drop C": [62, 57, 53, 48, 43, 36], // ADDED DROP C
            "Eb Standard": [63, 58, 54, 49, 44, 39],
            "D Standard": [62, 57, 53, 48, 43, 38],
            "Open G": [62, 59, 55, 50, 43, 38]
        };
        
        const scales = {
            "Major": [0, 2, 4, 5, 7, 9, 11],
            "Minor (Natural)": [0, 2, 3, 5, 7, 8, 10],
            "Pentatonic Major": [0, 2, 4, 7, 9],
            "Pentatonic Minor": [0, 3, 5, 7, 10],
            "Blues": [0, 3, 5, 6, 7, 10],
            "Harmonic Minor": [0, 2, 3, 5, 7, 8, 11],
            "Dorian": [0, 2, 3, 5, 7, 9, 10],
            "Phrygian": [0, 1, 3, 5, 7, 8, 10],
            "Lydian": [0, 2, 4, 6, 7, 9, 11],
            "Mixolydian": [0, 2, 4, 5, 7, 9, 10],
            "Locrian": [0, 1, 3, 5, 6, 8, 10]
        };

        const numberOfFrets = 24;
        const fretboardEl = document.getElementById('fretboard');
        const fretNumbersEl = document.getElementById('fretNumbers');
        const rootSelect = document.getElementById('rootNote');
        const scaleSelect = document.getElementById('scaleType');
        const tuningSelect = document.getElementById('tuningSelect');
        const startFretInput = document.getElementById('startFret');
        const endFretInput = document.getElementById('endFret');
        const playBtn = document.getElementById('playBtn');
        const tempoSlider = document.getElementById('tempoSlider');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const directionSelect = document.getElementById('directionSelect');

        let isPlaying = false;
        let shouldStop = false;

        function init() {
            noteNames.forEach((note, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = note;
                if(note === 'E') option.selected = true; 
                rootSelect.appendChild(option);
            });

            for (const [name, intervals] of Object.entries(scales)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                if(name === 'Minor (Natural)') option.selected = true;
                scaleSelect.appendChild(option);
            }

            for (const name of Object.keys(tunings)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                tuningSelect.appendChild(option);
            }

            drawFretboard();
            updateFretboard();

            rootSelect.addEventListener('change', updateFretboard);
            scaleSelect.addEventListener('change', updateFretboard);
            tuningSelect.addEventListener('change', () => {
                drawFretboard();
                updateFretboard();
            });
            startFretInput.addEventListener('change', updateFretboard);
            endFretInput.addEventListener('change', updateFretboard);
            
            tempoSlider.addEventListener('input', () => {
                bpmDisplay.textContent = tempoSlider.value;
            });
        }

        function drawFretboard() {
            fretboardEl.innerHTML = '';
            fretNumbersEl.innerHTML = '';
            const currentTuningName = tuningSelect.value || "Standard (E)";
            const currentBaseMidi = tunings[currentTuningName];

            currentBaseMidi.forEach((baseMidi, stringIndex) => {
                const stringRow = document.createElement('div');
                stringRow.classList.add('string');

                for (let fret = 0; fret <= numberOfFrets; fret++) {
                    const currentMidi = baseMidi + fret;
                    const noteIndex = currentMidi % 12;
                    const noteName = noteNames[noteIndex];

                    const fretDiv = document.createElement('div');
                    fretDiv.classList.add('note-fret');
                    if (fret === 0) fretDiv.classList.add('nut');

                    fretDiv.dataset.fret = fret;
                    fretDiv.dataset.string = stringIndex;

                    if (stringIndex === 2 || stringIndex === 3) {
                        if ([3, 5, 7, 9, 15, 17, 19, 21].includes(fret)) fretDiv.classList.add('single-fretmark');
                        if (fret === 12 || fret === 24) fretDiv.classList.add('double-fretmark');
                    }

                    const noteDisplay = document.createElement('div');
                    noteDisplay.classList.add('note-display');
                    noteDisplay.dataset.noteIndex = noteIndex; 
                    noteDisplay.dataset.midi = currentMidi;
                    noteDisplay.dataset.fret = fret;
                    noteDisplay.dataset.string = stringIndex;
                    noteDisplay.textContent = noteName;

                    fretDiv.appendChild(noteDisplay);

                    fretDiv.addEventListener('mousedown', () => {
                        playTone(currentMidi); 
                        noteDisplay.classList.add('playing');
                        setTimeout(() => noteDisplay.classList.remove('playing'), 150);
                    });

                    stringRow.appendChild(fretDiv);
                }
                fretboardEl.appendChild(stringRow);
            });

            const nutSpacer = document.createElement('div');
            nutSpacer.classList.add('fret-number-spacer');
            fretNumbersEl.appendChild(nutSpacer);

            for (let i = 1; i <= numberOfFrets; i++) {
                const numDiv = document.createElement('div');
                numDiv.classList.add('fret-number');
                numDiv.textContent = i;
                fretNumbersEl.appendChild(numDiv);
            }
        }

        function updateFretboard() {
            const rootIndex = parseInt(rootSelect.value);
            const scaleName = scaleSelect.value;
            const intervals = scales[scaleName];
            const allowedIndices = intervals.map(interval => (rootIndex + interval) % 12);
            
            const minFret = parseInt(startFretInput.value);
            const maxFret = parseInt(endFretInput.value);
            const allFrets = document.querySelectorAll('.note-fret');
            const allNotes = document.querySelectorAll('.note-display');

            allFrets.forEach(fretDiv => {
                const fNum = parseInt(fretDiv.dataset.fret);
                const sNum = parseInt(fretDiv.dataset.string);
                fretDiv.classList.remove('in-box', 'box-left', 'box-right', 'box-top', 'box-bottom');
                if (fNum >= minFret && fNum <= maxFret) {
                    fretDiv.classList.add('in-box');
                    if (fNum === minFret) fretDiv.classList.add('box-left');
                    if (fNum === maxFret) fretDiv.classList.add('box-right');
                    if (sNum === 0) fretDiv.classList.add('box-top');
                    if (sNum === 5) fretDiv.classList.add('box-bottom');
                }
            });

            allNotes.forEach(noteEl => {
                const noteIndex = parseInt(noteEl.dataset.noteIndex);
                noteEl.classList.remove('visible', 'root', 'scale-note');
                if (allowedIndices.includes(noteIndex)) {
                    noteEl.classList.add('visible');
                    if (noteIndex === rootIndex) noteEl.classList.add('root');
                    else noteEl.classList.add('scale-note');
                }
            });
        }

        function togglePlay() {
            if (isPlaying) shouldStop = true;
            else playScale();
        }

        async function playScale() {
            isPlaying = true;
            shouldStop = false;
            playBtn.textContent = "◼ Stop";
            playBtn.classList.add('stop');

            const minFret = parseInt(startFretInput.value);
            const maxFret = parseInt(endFretInput.value);
            const allNotes = Array.from(document.querySelectorAll('.note-display.visible'));
            const validNotes = allNotes.filter(n => {
                const f = parseInt(n.dataset.fret);
                return f >= minFret && f <= maxFret;
            });

            validNotes.sort((a, b) => {
                const stringA = parseInt(a.dataset.string);
                const stringB = parseInt(b.dataset.string);
                const fretA = parseInt(a.dataset.fret);
                const fretB = parseInt(b.dataset.fret);
                if (stringA !== stringB) return stringB - stringA; 
                return fretA - fretB;
            });

            const dir = directionSelect.value;
            if (dir === 'desc') validNotes.reverse();

            for (let note of validNotes) {
                if (shouldStop) break;
                const midi = parseInt(note.dataset.midi);
                const bpm = parseInt(tempoSlider.value);
                const delayMs = 60000 / bpm; 
                playTone(midi); 
                note.classList.add('playing');
                await new Promise(r => setTimeout(r, delayMs)); 
                note.classList.remove('playing');
            }

            isPlaying = false;
            shouldStop = false;
            playBtn.textContent = "▶ Play";
            playBtn.classList.remove('stop');
        }

        init();
    </script>
</body>
</html>
